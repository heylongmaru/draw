<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="座號轉盤、轉盤、硬幣、骰子、擲筊、跑團骰子、扭蛋機、樂透、彩球機、爬格子、拉霸機、文字拉霸。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23DF6448%27/%3E%3Cpath d=%27M16 16 L16 2 A14 14 0 0 1 30 16Z%27 fill=%27%23E8A53A%27/%3E%3Cpath d=%27M16 16 L30 16 A14 14 0 0 1 16 30Z%27 fill=%27%234E9F80%27/%3E%3Cpath d=%27M16 16 L16 30 A14 14 0 0 1 2 16Z%27 fill=%27%235A97C4%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274.5%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<title>抽籤遊樂場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

:root{
  --bg:#EEF0EA; --surface:#FFFFFF; --surface2:#F5F6F2; --stage:#E4E7E0;
  --ink:#262B31; --muted:#676D74; --line:#DADDD4; --line-strong:#A9AEA6;
  --shu:#DF6448; --yamabuki:#E8A53A; --wakatake:#4E9F80; --sora:#5A97C4; --fuji:#8C7BC0; --sakura:#E08BA0;
  --shadow:0 1px 2px rgba(38,43,49,.06),0 10px 28px -14px rgba(38,43,49,.22);
  --f-display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Fredoka","Huninn",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181B1F; --surface:#22262C; --surface2:#1D2025; --stage:#14171A;
    --ink:#ECEDE8; --muted:#9CA2A9; --line:#343941; --line-strong:#5A6068;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181B1F; --surface:#22262C; --surface2:#1D2025; --stage:#14171A;
  --ink:#ECEDE8; --muted:#9CA2A9; --line:#343941; --line-strong:#5A6068;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in oklab,var(--sora) 70%,transparent);outline-offset:2px}
.wrapx{max-width:1120px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top .wrapx{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-family:var(--f-display);font-size:20px}
.brand svg{width:30px;height:30px}
.sound{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
#vol{width:90px;accent-color:var(--shu)}

/* home */
.intro{padding-block:36px 20px;display:grid;gap:6px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.6vw,40px);line-height:1.2;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:16px}
.card{position:relative;display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 14px;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .art{display:grid;place-items:center;aspect-ratio:4/3;border-radius:12px;background:color-mix(in oklab,var(--tc) 17%,var(--surface));margin-bottom:8px;color:var(--ink)}
.card .art svg{width:76px;height:76px;transition:transform .25s}
.card:hover .art svg{transform:rotate(-7deg) scale(1.07)}
.card .nm{font-family:var(--f-display);font-size:19px;padding-inline:4px}
.card .en{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-inline:4px}
.card .tag{position:absolute;top:16px;right:16px;font-size:11px;background:var(--surface);border-radius:999px;padding:1px 8px;color:var(--muted)}
.card .new{position:absolute;top:16px;left:16px;font-size:11px;background:var(--shu);color:#fff;border-radius:999px;padding:1px 8px}
.wlist{display:grid;gap:5px;max-height:320px;overflow:auto}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 42px;gap:8px;align-items:center;font-size:14px}
.wrow .wn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow input{padding:4px 8px;text-align:center;font-family:var(--f-num)}
.wrow .wp{text-align:right;color:var(--muted);font-family:var(--f-num);font-size:13px}
.card .desc{font-size:13px;color:var(--muted);padding-inline:4px;line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chips{margin-top:24px!important}
.foot{margin-top:40px;padding-block:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;letter-spacing:.02em}

/* tool view */
.toolhead{display:flex;align-items:center;gap:14px;padding-block:20px 16px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.tt{display:flex;align-items:baseline;gap:10px}
.tt h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.6vw,32px)}
.tt .en{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.toolbody{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
@media (max-width:880px){.toolbody{grid-template-columns:minmax(0,1fr)}}
.stagecard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px}
.stage{position:relative;min-height:380px;display:grid;place-items:center;border-radius:16px;padding:28px 20px;background:var(--stage);background-image:radial-gradient(color-mix(in oklab,var(--ink) 9%,transparent) 1px,transparent 1.4px);background-size:18px 18px}
.stage.wide{display:block;padding:20px 16px}
.result{min-height:96px;display:grid;place-items:center;align-content:center;text-align:center;padding:4px 8px}
.r-main{font-family:var(--f-display);font-size:clamp(28px,5vw,46px);line-height:1.2;word-break:break-word;text-wrap:balance}
.r-main.huge{font-family:var(--f-num);font-weight:600;font-size:clamp(64px,12vw,120px);line-height:1}
.r-sub{color:var(--muted);font-size:14px}
.r-hint,.r-note{color:var(--muted)}
.result[data-level="big"] .r-main{color:var(--shu)}
.result[data-level="lose"] .r-main{color:var(--muted)}
.result.pop .r-main{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.go{--dk:color-mix(in oklab,var(--tc) 68%,#000);background:var(--tc);color:var(--tci,#fff);border:0;border-radius:999px;padding:14px 44px;font-family:var(--f-display);font-size:22px;box-shadow:0 5px 0 var(--dk);transition:transform .08s,box-shadow .08s;min-width:200px}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dk)}
.go:disabled{opacity:.6;cursor:wait}
.panel{display:grid;gap:14px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.pbox h2{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.cnt{color:var(--muted);font-weight:400}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;line-height:1.5}
.note{margin:0;font-size:13px;color:var(--muted)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.num button{border:0;background:none;width:34px;height:36px;font-size:18px}
.num input{border:0;border-radius:0;width:56px;text-align:center;padding:6px 0;background:transparent;font-family:var(--f-num);font-size:17px;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:14px;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog .sw{width:40px;height:24px;border-radius:12px;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tog input:checked+.sw{background:var(--wakatake)}
.tog input:checked+.sw::after{transform:translateX(16px)}
.tog input:focus-visible+.sw{outline:3px solid color-mix(in oklab,var(--sora) 70%,transparent);outline-offset:2px}
.sbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14px;text-align:center}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:4px;max-height:260px;overflow:auto;font-size:14px}
.hist li{display:flex;gap:10px;padding:5px 2px;border-bottom:1px dashed var(--line)}
.hist time{color:var(--muted);font-family:var(--f-num);font-size:12px;flex:none;padding-top:2px}
.hist .empty{color:var(--muted);border:0}

/* coin */
.coins{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;perspective:900px}
.coin-wrap{width:128px;height:128px;position:relative}
.coin-wrap.toss{animation:ctoss 1.1s cubic-bezier(.3,.6,.4,1)}
@keyframes ctoss{0%{transform:translateY(0)}45%{transform:translateY(-120px)}85%{transform:translateY(0)}92%{transform:translateY(-10px)}100%{transform:translateY(0)}}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.65,.25,1)}
.coin .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F7DA93,#DBA53E 60%,#B67F20);box-shadow:inset 0 0 0 7px rgba(255,255,255,.28),inset 0 0 0 10px rgba(120,80,10,.22)}
.coin .face span{font-family:var(--f-display);font-size:50px;color:rgba(96,58,6,.78)}
.coin .back{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#EEF1F3,#BBC4CA 60%,#8E999F);box-shadow:inset 0 0 0 7px rgba(255,255,255,.35),inset 0 0 0 10px rgba(40,55,65,.2)}
.coin .back span{color:rgba(40,50,60,.72)}

/* dice */
.dice{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;perspective:900px;max-width:460px}
.die-wrap{--s:78px;--h:39px;width:var(--s);height:var(--s)}
.die-wrap.toss{animation:dtoss 1.25s cubic-bezier(.3,.6,.4,1)}
@keyframes dtoss{0%{transform:translateY(0)}30%{transform:translateY(-80px)}62%{transform:translateY(0)}76%{transform:translateY(-14px)}100%{transform:translateY(0)}}
.die{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.25s cubic-bezier(.17,.84,.3,1)}
.die .face{position:absolute;inset:0;background:#FBFBF8;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -6px 10px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px}
.die .face i{display:block;width:13px;height:13px;border-radius:50%;place-self:center}
.die .face i.on{background:#2A2F36}
.die .f1 i.on{background:#D84A36;width:22px;height:22px}
.die .f1{transform:translateZ(var(--h))}.die .f6{transform:rotateY(180deg) translateZ(var(--h))}
.die .f3{transform:rotateY(90deg) translateZ(var(--h))}.die .f4{transform:rotateY(-90deg) translateZ(var(--h))}
.die .f5{transform:rotateX(90deg) translateZ(var(--h))}.die .f2{transform:rotateX(-90deg) translateZ(var(--h))}

/* bwa bwei */
.bw{display:grid;justify-items:center;gap:10px;width:100%}
.bw-q{margin:0;font-family:var(--f-display);font-size:18px;min-height:1.6em;text-align:center}
.bw-row{display:flex;gap:28px;justify-content:center;align-items:flex-end;min-height:190px;flex-wrap:wrap}
.bwei{width:150px;display:grid;justify-items:center;gap:6px}
.bwei svg{width:150px;height:60px;overflow:visible}
.bwei.throw svg{animation:bthrow 1s cubic-bezier(.3,.6,.4,1)}
@keyframes bthrow{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-130px) rotate(var(--r1))}78%{transform:translateY(0) rotate(var(--r2))}88%{transform:translateY(-12px) rotate(var(--r2))}100%{transform:translateY(0) rotate(var(--r2))}}
.bwei .lab{font-size:13px;color:var(--muted)}
.bw-streak{margin:0;font-size:14px;color:var(--muted);min-height:1.6em;letter-spacing:.05em}

/* dnd */
.dnd{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:520px}
.dd{width:84px;display:grid;justify-items:center}
.dd svg{width:84px;height:84px}
.dnd.rolling .dd{animation:shake .14s infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,-2px) rotate(-6deg)}50%{transform:translate(2px,2px) rotate(4deg)}75%{transform:translate(3px,-1px) rotate(-3deg)}100%{transform:translate(0,0) rotate(0)}}
.dlab{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.dadd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dadd button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 0;font-family:var(--f-num);font-size:15px}
.dpool{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:3px 10px;background:color-mix(in oklab,var(--c) 22%,var(--surface));font-family:var(--f-num);font-size:14px}

/* gashapon */
.gacha{position:relative;width:240px;height:330px}
.dome{position:absolute;left:20px;top:0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.35) 30%,rgba(210,225,232,.35) 70%);border:6px solid color-mix(in oklab,var(--tc) 85%,#000);overflow:hidden;box-shadow:inset 0 -12px 22px rgba(0,0,0,.08)}
.dome.shake{animation:dshake .9s}
@keyframes dshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-4deg)}35%{transform:rotate(4deg)}55%{transform:rotate(-3deg)}75%{transform:rotate(2deg)}}
.cap{position:absolute;width:40px;height:40px;border-radius:50%;background:linear-gradient(var(--c) 50%,#F5F4EF 50%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.25)}
.gbody{position:absolute;left:10px;top:182px;width:220px;height:140px;background:var(--tc);border-radius:14px 14px 20px 20px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.glabel{position:absolute;left:16px;top:12px;font-family:var(--f-num);font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.9);font-size:13px}
.knob{position:absolute;left:50%;top:26px;margin-left:-32px;width:64px;height:64px;border-radius:50%;border:0;background:#F6F5F0;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .9s cubic-bezier(.4,.1,.3,1)}
.knob span{position:absolute;left:50%;top:7px;bottom:7px;width:14px;margin-left:-7px;border-radius:7px;background:#3A3F46}
.chute{position:absolute;right:22px;bottom:16px;width:56px;height:40px;border-radius:12px 12px 6px 6px;background:rgba(0,0,0,.32)}
.capout{position:absolute;left:calc(50% - 60px);top:120px;width:120px;height:120px;z-index:3;animation:capdrop .8s cubic-bezier(.3,.7,.4,1.2) both}
@keyframes capdrop{0%{transform:translate(61px,102px) scale(.33)}45%{transform:translate(30px,60px) scale(.6)}100%{transform:translate(0,0) scale(1)}}
.capout .half{position:absolute;left:0;width:120px;height:60px;transition:transform .5s cubic-bezier(.3,.7,.3,1),opacity .5s .2s;box-shadow:inset 0 -4px 8px rgba(0,0,0,.12)}
.capout .t{top:0;border-radius:60px 60px 0 0;background:var(--c)}
.capout .b{bottom:0;border-radius:0 0 60px 60px;background:#F5F4EF}
.capout.open .t{transform:translate(-50px,-60px) rotate(-40deg);opacity:0}
.capout.open .b{transform:translate(50px,50px) rotate(30deg);opacity:0}
.capout .paper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);background:#FFFDF6;color:#2A2F36;padding:10px 18px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-family:var(--f-display);font-size:22px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;transition:transform .45s .12s cubic-bezier(.3,1.6,.5,1)}
.capout.open .paper{transform:translate(-50%,-50%) scale(1)}

/* lotto */
.lotto{display:grid;justify-items:center;gap:16px;width:100%}
.drum{width:min(290px,100%);height:auto;aspect-ratio:1}
.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:50px;align-items:center}
.tray-empty{color:var(--muted);font-size:14px}
.lball{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:18px;color:#2A2F36;background:radial-gradient(circle,#fff 0 44%,var(--c) 45%);box-shadow:inset -4px -5px 8px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.2);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.lball.sp{outline:3px dashed var(--shu);outline-offset:3px;margin-left:12px}

/* wheel */
.wheel-wrap{position:relative;width:min(100%,440px);aspect-ratio:1}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--ink);transform-origin:50% 0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:5px solid var(--ink);background:var(--surface);font-family:var(--f-num);font-weight:700;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.hub:active{transform:scale(.95)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 8px;font-family:var(--f-num);font-size:15px}
.drawn{display:flex;flex-wrap:wrap;gap:5px}
.drawn span{min-width:30px;text-align:center;border-radius:8px;padding:1px 6px;background:color-mix(in oklab,var(--fuji) 20%,var(--surface));font-family:var(--f-num);font-size:14px}
.drawn span:first-child{background:var(--fuji);color:#fff}

/* slot */
.slotm{display:flex;align-items:center;gap:12px}
.cab{background:var(--tc);padding:14px 14px 18px;border-radius:22px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),var(--shadow)}
.cab.flash{animation:flash .25s 6 alternate}
@keyframes flash{to{filter:brightness(1.35) saturate(1.2)}}
.cab-top{font-family:var(--f-num);color:#fff;letter-spacing:.2em;text-align:center;margin-bottom:10px;font-weight:700}
.reels{display:flex;gap:8px;background:#1E2126;padding:8px;border-radius:12px;position:relative}
.reels::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:rgba(223,100,72,.75);pointer-events:none}
.reel{--cell:76px;width:84px;height:calc(var(--cell)*3);overflow:hidden;background:linear-gradient(#C9CCC4,#FFFFFF 28%,#FFFFFF 72%,#C9CCC4);border-radius:8px;position:relative}
.reel.stop{animation:rstop .3s}
@keyframes rstop{50%{transform:translateY(3px)}}
.strip{will-change:transform}
.cell{height:var(--cell);display:grid;place-items:center;overflow:hidden}
.sym{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.sym.bar{font-size:20px;letter-spacing:.06em;background:#2A2F36;color:#fff!important;padding:4px 8px;border-radius:6px}
.lever{position:relative;width:34px;height:210px;border:0;background:none;padding:0}
.lever .stick{position:absolute;left:14px;top:30px;width:6px;height:140px;background:#9AA0A6;border-radius:3px;transform-origin:50% 100%;transition:transform .18s}
.lever .knobball{position:absolute;left:0;top:4px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F59A83,#DF6448 60%,#A83C27);transition:transform .18s}
.lever::after{content:"";position:absolute;left:5px;bottom:20px;width:24px;height:30px;border-radius:6px;background:var(--line-strong)}
.lever.pull .stick{transform:scaleY(.25)}
.lever.pull .knobball{transform:translateY(105px)}
.tslot{width:100%;max-width:560px}
.reels.text .reel{width:auto;flex:1;min-width:0;--cell:70px}
.tcell{font-family:var(--f-display);font-size:clamp(15px,2.4vw,21px);padding:0 6px;text-align:center;line-height:1.25;color:#2A2F36;overflow-wrap:anywhere}

/* garagara */
.gg-cv{width:min(360px,100%);height:auto;aspect-ratio:6/5}
.prizes{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:16px minmax(0,1fr) 58px 48px;gap:6px;align-items:center}
.prow .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.prow input{padding:5px 8px}
.prow .left{font-size:12px;color:var(--muted);text-align:right;font-family:var(--f-num)}

/* ghost leg */
.gl{width:100%}
.gl-row{display:grid;gap:4px}
.gl-top button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-family:var(--f-display);font-size:clamp(12px,1.8vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl-top button.on{background:var(--c);color:#fff;border-color:transparent}
.gl-cv{width:100%;height:300px;display:block}
.glc{border-radius:10px;padding:8px 2px;text-align:center;background:var(--surface2);border:1px dashed var(--line-strong);font-family:var(--f-display);font-size:clamp(12px,1.8vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glc.hit{background:var(--c);color:#fff;border:1px solid transparent;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (max-width:540px){
  .reel{--cell:62px;width:68px}
  .sym{font-size:36px}
  .stage{padding:22px 10px;min-height:340px}
  .go{min-width:0;width:100%}
  .coin-wrap{width:104px;height:104px}
  .bwei,.bwei svg{width:124px}
  #vol{width:64px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gRed" cx="45%" cy="20%" r="90%"><stop offset="0" stop-color="#F29A7E"/><stop offset=".55" stop-color="#D24A33"/><stop offset="1" stop-color="#992C1E"/></radialGradient>
<linearGradient id="gFlat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9B790"/><stop offset="1" stop-color="#C98A5E"/></linearGradient>
</defs></svg>

<header class="top"><div class="wrapx">
  <button class="brand" id="brand" type="button" aria-label="回到首頁">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#DF6448"/><path d="M16 16 L16 2 A14 14 0 0 1 30 16Z" fill="#E8A53A"/><path d="M16 16 L30 16 A14 14 0 0 1 16 30Z" fill="#4E9F80"/><path d="M16 16 L16 30 A14 14 0 0 1 2 16Z" fill="#5A97C4"/><circle cx="16" cy="16" r="4.5" fill="#fff"/></svg>
    抽籤遊樂場
  </button>
  <div class="sound">
    <button class="icon-btn" id="mute" type="button" aria-label="靜音"></button>
    <input id="vol" type="range" min="0" max="1" step="0.05" aria-label="音量">
  </div>
</div></header>
<main id="view" class="wrapx"></main>
<footer class="foot wrapx">© 2026 Heylongmaru. All Rights Reserved</footer>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const u32 = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; };
const rnd = n => Math.floor(u32() / 4294967296 * n);
const rndf = () => u32() / 4294967296;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TAU = Math.PI * 2;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL = ['#DF6448', '#E8A53A', '#4E9F80', '#5A97C4', '#8C7BC0', '#E08BA0', '#3F8C9A', '#C9A13B'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('dp:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dp:' + k, JSON.stringify(v)); } catch (e) {} }
};
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- sound engine (all synthesized) ---------- */
const Sfx = (() => {
  let ctx = null, master = null, nbuf = null;
  let vol = store.get('vol', 0.7), muted = store.get('muted', false);
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = muted ? 0 : vol;
      const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function env(g, t0, a, d, peak) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
  function tone(f, { t = 0, d = .15, type = 'sine', g = .25, to = null, a = .004 } = {}) {
    const c = ac(); if (!c) return; const t0 = c.currentTime + t;
    const o = c.createOscillator(), gn = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + a + d);
    env(gn, t0, a, d, g); o.connect(gn); gn.connect(master); o.start(t0); o.stop(t0 + a + d + .05);
  }
  function noise({ t = 0, d = .1, g = .3, type = 'bandpass', f = 1500, q = 1, to = null, a = .002 } = {}) {
    const c = ac(); if (!c) return; const t0 = c.currentTime + t;
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t0); if (to) fl.frequency.exponentialRampToValueAtTime(to, t0 + a + d); fl.Q.value = q;
    const gn = c.createGain(); env(gn, t0, a, d, g); s.connect(fl); fl.connect(gn); gn.connect(master);
    s.start(t0, Math.random() * .5); s.stop(t0 + a + d + .05);
  }
  const N = { C5: 523.25, E5: 659.25, G5: 783.99, C6: 1046.5, E6: 1318.5, G6: 1568 };
  return {
    unlock() { ac(); },
    get muted() { return muted; }, get vol() { return vol; },
    setMuted(m) { muted = m; store.set('muted', m); if (master) master.gain.setTargetAtTime(m ? 0 : vol, ctx.currentTime, .02); },
    setVol(v) { vol = v; store.set('vol', v); if (master && !muted) master.gain.setTargetAtTime(v, ctx.currentTime, .02); },
    click() { tone(1800, { d: .03, type: 'square', g: .05 }); },
    tick(p = 1) { tone(1400 * p, { d: .035, type: 'triangle', g: .18 }); noise({ d: .02, g: .12, f: 3500 * p, q: 2 }); },
    clack(p = 1) { noise({ d: .05, g: .5, f: 1100 * p, q: 6 }); tone(720 * p, { d: .06, type: 'triangle', g: .2 }); },
    thud() { tone(150, { d: .18, g: .45, to: 70 }); noise({ d: .06, g: .2, type: 'lowpass', f: 600 }); },
    whoosh(d = .5) { noise({ d, g: .25, f: 400, to: 3000, q: .7, a: d * .4 }); },
    ting() { tone(2093, { d: .9, g: .14 }); tone(3140, { d: .6, g: .07 }); tone(4186, { d: .35, g: .04 }); },
    pop() { tone(320, { d: .09, g: .35, to: 980 }); noise({ d: .04, g: .15, f: 2500 }); },
    ding(p = 1) { tone(1318.5 * p, { d: .5, g: .18 }); tone(2637 * p, { d: .3, g: .06 }); },
    blip(i = 0) { tone(440 * Math.pow(2, (i % 15) / 12), { d: .06, type: 'square', g: .07 }); },
    ratchet(n = 8, span = .8) { for (let i = 0; i < n; i++) { const t = i * span / n; noise({ t, d: .03, g: .35, f: 2200, q: 4 }); tone(1600, { t, d: .02, type: 'square', g: .05 }); } },
    rattle(d = 1, n = 14) { for (let i = 0; i < n; i++) noise({ t: rndf() * d, d: .035, g: .3 + rndf() * .2, f: 900 + rndf() * 1500, q: 5 }); },
    rumble(d = 1.5) { noise({ d, g: .16, type: 'lowpass', f: 500, q: .5, a: .2 }); for (let i = 0; i < d * 14; i++) noise({ t: rndf() * d, d: .03, g: .14, f: 1800 + rndf() * 1500, q: 6 }); },
    drumroll(d = 1.2) { for (let t = 0; t < d; t += .045) noise({ t, d: .04, g: .1 + .2 * t / d, f: 260, type: 'lowpass', q: .8 }); tone(180, { t: d, d: .3, g: .4, to: 90 }); },
    reveal() { tone(660, { d: .12, type: 'triangle', g: .15 }); tone(990, { t: .08, d: .25, type: 'triangle', g: .15 }); },
    win() {
      [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => { tone(f, { t: i * .09, d: .18, type: 'square', g: .08 }); tone(f * 2, { t: i * .09, d: .12, g: .04 }); });
      tone(N.C6, { t: .36, d: .5, type: 'triangle', g: .18 }); tone(N.E6, { t: .36, d: .5, type: 'triangle', g: .1 });
    },
    bigWin() {
      [N.G5, N.C6, N.E6, N.G6].forEach((f, i) => tone(f, { t: i * .08, d: .14, type: 'square', g: .08 }));
      [0, .12, .24, .36].forEach(t => { tone(N.C6, { t: .4 + t, d: .1, type: 'square', g: .06 }); tone(N.E6, { t: .4 + t, d: .1, type: 'square', g: .05 }); });
      [N.C6, N.E6, N.G6].forEach((f, i) => tone(f, { t: .95, d: .9, type: 'triangle', g: .18 - i * .04 }));
      for (let i = 0; i < 10; i++) tone(2000 + rndf() * 3000, { t: .95 + i * .06, d: .12, g: .04 });
    },
    lose() { [392, 370, 349, 311].forEach((f, i) => tone(f, { t: i * .26, d: i === 3 ? .7 : .22, type: 'sawtooth', g: .06, to: i === 3 ? f * .92 : null })); },
    bell() { [0, .22, .44, .66, .88].forEach(t => { [1, 2.76, 5.4].forEach((r, j) => tone(880 * r, { t, d: .5 - j * .1, g: .12 / (j + 1) })); noise({ t, d: .02, g: .2, f: 4000, q: 2 }); }); }
  };
})();

/* ---------- confetti ---------- */
const Confetti = (() => {
  const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], raf = 0;
  const size = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; };
  addEventListener('resize', size); size();
  function step() {
    const d = devicePixelRatio; cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life < 220 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.life++; p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.fillRect(-p.w * d / 2, -p.h * d / 2 * Math.abs(Math.cos(p.life * .15)), p.w * d, p.h * d * Math.abs(Math.cos(p.life * .15)) + 1); cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(step) : 0;
  }
  return {
    burst(n = 100) {
      if (reduced) return;
      const x = innerWidth / 2, y = innerHeight * .45;
      for (let i = 0; i < n; i++) { const a = rndf() * TAU, s = 4 + rndf() * 10; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 7, r: rndf() * 6, vr: (rndf() - .5) * .3, w: 7 + rndf() * 6, h: 4 + rndf() * 5, c: PAL[i % PAL.length], life: 0 }); }
      if (!raf) raf = requestAnimationFrame(step);
    }
  };
})();

/* ---------- form controls ---------- */
function listField(parent, { id, label, def, rows = 6 }) {
  const key = 'list:' + id;
  const w = h(`<div class="field"><label for="${id}">${label}<span class="cnt"></span></label><textarea id="${id}" rows="${rows}" spellcheck="false"></textarea><button type="button" class="linkbtn" style="justify-self:start">恢復範例</button></div>`);
  parent.append(w);
  const ta = w.querySelector('textarea'), cnt = w.querySelector('.cnt');
  ta.value = store.get(key, def).join('\n');
  const get = () => ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  const upd = () => { cnt.textContent = get().length + ' 項'; };
  const api = {
    get, el: ta, onchange: null,
    set(arr) { ta.value = arr.join('\n'); store.set(key, arr); upd(); api.onchange && api.onchange(); }
  };
  ta.addEventListener('input', () => { store.set(key, get()); upd(); api.onchange && api.onchange(); });
  w.querySelector('.linkbtn').onclick = () => api.set(def);
  upd();
  return api;
}
function numField(parent, { id, label, def, min, max, onchange }) {
  const key = 'num:' + id; const clamp = v => Math.max(min, Math.min(max, Number.isFinite(v) ? v : def));
  let v = clamp(store.get(key, def));
  const w = h(`<div class="row2"><label for="${id}" style="font-size:14px;font-weight:500">${label}</label><div class="num"><button type="button" aria-label="減少">−</button><input id="${id}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${v}"><button type="button" aria-label="增加">+</button></div></div>`);
  parent.append(w);
  const inp = w.querySelector('input'), [minus, plus] = w.querySelectorAll('button');
  const set = (nv, fire = true) => { v = clamp(Math.round(nv)); inp.value = v; store.set(key, v); if (fire && onchange) onchange(v); };
  inp.addEventListener('change', () => set(parseInt(inp.value, 10)));
  minus.onclick = () => { Sfx.click(); set(v - 1); }; plus.onclick = () => { Sfx.click(); set(v + 1); };
  return { get: () => v, set };
}
function toggle(parent, { id, label, def, onchange }) {
  const key = 'tog:' + id; let v = store.get(key, def);
  const w = h(`<label class="tog" for="${id}"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}><span class="sw"></span><span>${label}</span></label>`);
  parent.append(w); const i = w.querySelector('input');
  i.onchange = () => { v = i.checked; store.set(key, v); Sfx.click(); onchange && onchange(v); };
  return { get: () => v };
}
function seg(parent, { id, label, options, def, onchange }) {
  const key = 'seg:' + id; let val = store.get(key, def); if (!options.some(o => o[0] === val)) val = def;
  const w = h(`<div class="field"><span class="lbl" id="${id}-l">${label}</span><div class="seg" role="radiogroup" aria-labelledby="${id}-l">${options.map(([v, l]) => `<button type="button" role="radio" data-v="${v}">${l}</button>`).join('')}</div></div>`);
  parent.append(w); const btns = [...w.querySelectorAll('button')];
  const paint = () => btns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === String(val))));
  btns.forEach(b => b.onclick = () => { const o = options.find(o => String(o[0]) === b.dataset.v); val = o[0]; store.set(key, val); paint(); Sfx.click(); onchange && onchange(val); });
  paint(); return { get: () => val };
}
function sbtn(parent, label, fn) { const b = h(`<button type="button" class="sbtn">${label}</button>`); b.onclick = () => { Sfx.click(); fn(); }; parent.append(b); return b; }

/* ---------- icons ---------- */
function wedges(n, cols, r = 24, cx = 32, cy = 32) {
  let s = ''; for (let i = 0; i < n; i++) { const a0 = -Math.PI / 2 + i * TAU / n, a1 = a0 + TAU / n;
    s += `<path d="M${cx},${cy} L${(cx + r * Math.cos(a0)).toFixed(2)},${(cy + r * Math.sin(a0)).toFixed(2)} A${r},${r} 0 0 1 ${(cx + r * Math.cos(a1)).toFixed(2)},${(cy + r * Math.sin(a1)).toFixed(2)} Z" fill="${cols[i % cols.length]}"/>`; }
  return s;
}
const ICON = {
  coin: c => `<svg viewBox="0 0 64 64"><circle cx="32" cy="30" r="22" fill="${c}"/><circle cx="32" cy="30" r="16" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/><text x="32" y="37" text-anchor="middle" font-size="18" fill="#fff" font-family="Huninn,sans-serif">正</text></svg>`,
  dice: c => `<svg viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="10" fill="${c}"/><circle cx="23" cy="23" r="4" fill="#fff"/><circle cx="32" cy="32" r="4" fill="#fff"/><circle cx="41" cy="41" r="4" fill="#fff"/></svg>`,
  bwabwei: c => `<svg viewBox="0 0 64 64"><path d="M4 40 C10 16 28 16 32 36 C24 30 12 30 4 40Z" fill="${c}"/><path d="M60 46 C54 22 36 22 32 42 C40 36 52 36 60 46Z" fill="${c}" opacity=".75"/></svg>`,
  dnd: c => `<svg viewBox="0 0 64 64"><polygon points="32,6 55,19 55,45 32,58 9,45 9,19" fill="${c}"/><polygon points="32,17 46,41 18,41" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><text x="32" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Fredoka,sans-serif">20</text></svg>`,
  gashapon: c => `<svg viewBox="0 0 64 64"><circle cx="32" cy="24" r="17" fill="#fff" stroke="${c}" stroke-width="4"/><circle cx="26" cy="29" r="5" fill="#E8A53A"/><circle cx="37" cy="30" r="5" fill="#5A97C4"/><circle cx="32" cy="20" r="5" fill="#4E9F80"/><rect x="15" y="38" width="34" height="20" rx="5" fill="${c}"/><circle cx="32" cy="47" r="5" fill="#fff"/></svg>`,
  lotto: c => `<svg viewBox="0 0 64 64"><circle cx="21" cy="40" r="12" fill="${c}"/><circle cx="43" cy="40" r="12" fill="#E8A53A"/><circle cx="32" cy="21" r="12" fill="#5A97C4"/><g font-family="Fredoka,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2A2F36"><circle cx="21" cy="40" r="6" fill="#fff"/><text x="21" y="43.5">7</text><circle cx="43" cy="40" r="6" fill="#fff"/><text x="43" y="43.5">3</text><circle cx="32" cy="21" r="6" fill="#fff"/><text x="32" y="24.5">1</text></g></svg>`,

/* ---------- reusable: wheel ---------- */
function makeWheel(u, opts = {}) {
  const wrap = h('<div class="wheel-wrap"><canvas></canvas><span class="pointer" aria-hidden="true"></span><button class="hub" type="button" aria-label="轉動轉盤">GO</button></div>');
  u.stage.append(wrap);
  const cv = wrap.querySelector('canvas'), ctx = cv.getContext('2d'), ptr = wrap.querySelector('.pointer');
  let rot = 0, items = [], S = 0, st0 = [], sz = [];
  const layout = ws => { const n = items.length, w = items.map((_, i) => ws && ws[i] > 0 ? ws[i] : (ws ? 0 : 1)), tot = w.reduce((a, b) => a + b, 0) || 1; let acc = 0; st0 = []; sz = []; for (let i = 0; i < n; i++) { st0.push(acc); sz.push(w[i] / tot * TAU); acc += w[i] / tot * TAU; } };
  const color = opts.color || ((i, n) => { let c = i % PAL.length; if (n > 1 && i === n - 1 && c === 0) c = 2; return PAL[c]; });
  function size() { const d = devicePixelRatio || 1; S = wrap.clientWidth; if (!S) return; cv.width = S * d; cv.height = S * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
  function draw() {
    if (!S) return; const c = S / 2, R = c - 10, n = items.length;
    ctx.clearRect(0, 0, S, S);
    ctx.beginPath(); ctx.arc(c, c, R + 8, 0, TAU); ctx.fillStyle = css('--ink'); ctx.fill();
    if (!n) { ctx.beginPath(); ctx.arc(c, c, R, 0, TAU); ctx.fillStyle = css('--surface2'); ctx.fill(); return; }
    for (let i = 0; i < n; i++) {
      const a = sz[i], s = -Math.PI / 2 + rot + st0[i], fs = Math.max(9, Math.min(opts.maxFont || 22, R * .72 * a * .62));
      if (a <= 0) continue;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, s, s + a); ctx.closePath();
      const col = color(i, n); ctx.fillStyle = col; ctx.fill();
      if (n > 1) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2; ctx.stroke(); }
      ctx.save(); ctx.translate(c, c); ctx.rotate(s + a / 2);
      ctx.fillStyle = opts.textColor ? opts.textColor(i, n) : '#fff';
      ctx.font = `${opts.numeric ? '600 ' : ''}${fs}px ${opts.numeric ? 'Fredoka,' : ''}Huninn,"Noto Sans TC",sans-serif`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      let t = items[i]; const maxW = R * .6;
      if (ctx.measureText(t).width > maxW) { while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1); t += '…'; }
      ctx.fillText(t, R - 12, 1); ctx.restore();
    }
    if (n <= 60) for (let i = 0; i < n; i++) { const s = -Math.PI / 2 + rot + st0[i]; ctx.beginPath(); ctx.arc(c + Math.cos(s) * (R + 3), c + Math.sin(s) * (R + 3), 2.6, 0, TAU); ctx.fillStyle = '#F4F1E6'; ctx.fill(); }
  }
  const ro = new ResizeObserver(size); ro.observe(wrap); u.cleanups.push(() => ro.disconnect());
  if (document.fonts) document.fonts.ready.then(draw);
  const idxAt = r => { const p = (((-r) % TAU) + TAU) % TAU; for (let i = 0; i < items.length; i++) if (sz[i] > 0 && p >= st0[i] && p < st0[i] + sz[i]) return i; return items.length - 1; };
  return {
    hub: wrap.querySelector('.hub'),
    set(arr, ws) { items = arr; layout(ws); draw(); },
    spin(k) {
      return new Promise(res => {
        const base = -(st0[k] + sz[k] * (.12 + .76 * rndf()));
        const min = rot + TAU * (5 + rnd(3));
        const fin = base + TAU * Math.ceil((min - base) / TAU);
        const st = rot, dur = reduced ? 700 : 4600 + rnd(1400), t0 = performance.now();
        let last = idxAt(rot), lt = 0;
        const f = now => {
          const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
          rot = st + (fin - st) * e;
          const i = idxAt(rot);
          if (i !== last) { last = i; if (now - lt > 28) { lt = now; Sfx.tick(1); ptr.animate([{ transform: 'translateX(-50%) rotate(-24deg)' }, { transform: 'translateX(-50%) rotate(0deg)' }], { duration: 140, easing: 'ease-out' }); } }
          draw();
          if (p < 1) requestAnimationFrame(f); else { rot = ((fin % TAU) + TAU) % TAU; draw(); res(); }
        };
        requestAnimationFrame(f);
      });
    }
  };
}

/* ---------- reusable: slot reels ---------- */
function makeReels(container, count, { render }) {
  const reels = [];
  for (let i = 0; i < count; i++) { const el = h('<div class="reel"><div class="strip"></div></div>'); container.append(el); reels.push({ el, strip: el.firstElementChild, vis: [] }); }
  const cellH = () => reels[0].el.clientHeight / 3;
  const pick = a => a[rnd(a.length)];
  const setStrip = (rl, arr) => { rl.strip.style.transition = 'none'; rl.strip.style.transform = 'translateY(0px)'; rl.strip.innerHTML = arr.map(x => `<div class="cell">${render(x)}</div>`).join(''); };
  return {
    init(pools) { reels.forEach((rl, i) => { rl.vis = [pick(pools[i]), pick(pools[i]), pick(pools[i])]; setStrip(rl, rl.vis); }); },
    async spin(pools, finals, base) {
      const ch = cellH();
      const done = reels.map((rl, i) => new Promise(res => {
        const p = pools[i], arr = [...rl.vis], L = 16 + i * 5;
        for (let k = 0; k < L; k++) arr.push(pick(p));
        arr.push(pick(p), finals[i], pick(p));
        setStrip(rl, arr); void rl.strip.offsetHeight;
        const dur = base + i * 450;
        rl.strip.style.transition = `transform ${dur}ms cubic-bezier(.3,.1,.25,1.012)`;
        rl.strip.style.transform = `translateY(${-(arr.length - 3) * ch}px)`;
        rl.vis = arr.slice(-3);
        setTimeout(() => { Sfx.clack(.75); Sfx.thud(); rl.el.classList.remove('stop'); void rl.el.offsetWidth; rl.el.classList.add('stop'); res(); }, dur);
      }));
      let alive = true, lt = 0; const last = reels.map(() => 0);
      const loop = now => {
        if (!alive) return;
        reels.forEach((rl, i) => {
          const tr = getComputedStyle(rl.strip).transform;
          const y = tr && tr !== 'none' ? new DOMMatrixReadOnly(tr).m42 : 0;
          const idx = Math.floor(-y / ch);
          if (idx !== last[i]) { last[i] = idx; if (now - lt > 40) { lt = now; Sfx.tick(.5 + i * .07); } }
        });
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
      await Promise.all(done); alive = false;
      reels.forEach(rl => setStrip(rl, rl.vis));
    }
  };
}

      let x = rnd(total), i = 0; while (x >= left[i]) { x -= left[i]; i++; }
      left[i]--; save(); paintLeft();
      Sfx.clack(1.3); await dropBall(TIERS[i][1]);
      const name = prizes[i].name, sub = `${TIERS[i][0]}球`;
      if (i === 0) { Sfx.bell(); u.show(name, sub, 'big'); }
      else if (i === 1) u.show(name, sub, 'win');
      else u.show(name, sub, 'plain');
      u.log(`${name}（${sub}）`);
    });
  } },
{ id: 'ghostleg', name: '爬格子', en: 'Ghost Leg', cat: 'draw', color: '#3F8C9A', desc: '設定參加者和結果，沿著梯子走到底',
  mount(u) {
    u.stage.classList.add('wide');
    const names = listField(u.settings, { id: 'glNames', label: '上面：參加者（最多 12 位）', def: DEF.glNames, rows: 5 });
    const resL = listField(u.settings, { id: 'glRes', label: '下面：結果', def: DEF.glRes, rows: 5 });
    const hide = toggle(u.settings, { id: 'glHide', label: '結果先蓋住', def: true, onchange: () => paintBottom() });
    sbtn(u.settings, '重新畫梯子', () => { if (!u.busy) { gen(); Sfx.whoosh(.3); } });
    const note = h('<p class="note"></p>'); u.settings.append(note);
    const box = h('<div class="gl"><div class="gl-row gl-top"></div><canvas class="gl-cv"></canvas><div class="gl-row gl-bot"></div></div>'); u.stage.append(box);
    const top = box.children[0], cv = box.children[1], bot = box.children[2], ctx = cv.getContext('2d');
    const L = 10, H = 300; let N = [], R = [], n = 0, rungs = [], traced = new Map(), W = 0, raf = 0;
    function gen() {
      N = names.get().slice(0, 12); n = N.length;
      R = resL.get().slice(0, n); while (R.length < n) R.push('（空白）');
      const msgs = []; if (names.get().length > 12) msgs.push('只用前 12 位。'); if (resL.get().length !== n && n) msgs.push(`結果有 ${resL.get().length} 項、參加者 ${n} 位，${resL.get().length < n ? '不足的補「（空白）」' : '多的不用'}。`);
      note.textContent = msgs.join(' ');
      rungs = []; for (let l = 0; l < L; l++) { const row = []; for (let i = 0; i < n - 1; i++) row.push(!row[i - 1] && rndf() < .4); rungs.push(row); }
      for (let pass = 0; pass < 2; pass++) for (let i = 0; i < n - 1; i++) if (!rungs.some(r => r[i])) {
        const cand = [...Array(L).keys()].filter(l => !rungs[l][i - 1] && !rungs[l][i + 1]); const l = cand.length ? cand[rnd(cand.length)] : rnd(L);
        rungs[l][i] = true; if (i > 0) rungs[l][i - 1] = false; if (i < n - 2) rungs[l][i + 1] = false; }
      traced = new Map(); layout();
    }
    function layout() {
      top.style.gridTemplateColumns = bot.style.gridTemplateColumns = `repeat(${Math.max(n, 1)},minmax(0,1fr))`;
      top.innerHTML = N.map((s, i) => `<button type="button" data-i="${i}" style="--c:${PAL[i % PAL.length]}">${esc(s)}</button>`).join('');
      top.querySelectorAll('button').forEach(b => b.onclick = () => u.run(() => trace(+b.dataset.i, false)));
      paintBottom(); size();
    }
    function paintBottom() {
      bot.innerHTML = R.map((s, j) => { let who = -1; traced.forEach((t, i) => { if (t.done && t.end === j) who = i; });
        const show = !hide.get() || who >= 0; return `<div class="glc${who >= 0 ? ' hit' : ''}" style="${who >= 0 ? `--c:${PAL[who % PAL.length]}` : ''}">${show ? esc(s) : '?'}</div>`; }).join('');
    }
    function size() { const d = devicePixelRatio || 1; W = box.clientWidth; if (!W) return; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
    const X = c => (c + .5) * W / n, Y = v => 12 + v * (H - 24) / (L + 1);
    function draw() {
      ctx.clearRect(0, 0, W, H); if (n < 1) return;
      ctx.lineCap = 'round'; ctx.strokeStyle = css('--line-strong'); ctx.lineWidth = 3; ctx.beginPath();
      for (let c = 0; c < n; c++) { ctx.moveTo(X(c), Y(0)); ctx.lineTo(X(c), Y(L + 1)); }
      rungs.forEach((row, l) => row.forEach((on, i) => { if (on) { ctx.moveTo(X(i), Y(l + 1)); ctx.lineTo(X(i + 1), Y(l + 1)); } }));
      ctx.stroke();
      traced.forEach((t, i) => {
        ctx.strokeStyle = PAL[i % PAL.length]; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath();
        let rem = t.prog; ctx.moveTo(X(t.pts[0][0]), Y(t.pts[0][1]));
        for (let k = 1; k < t.pts.length; k++) { const [x0, y0] = t.pts[k - 1], [x1, y1] = t.pts[k], len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
          if (rem >= len) { ctx.lineTo(X(x1), Y(y1)); rem -= len; } else { const f = rem / len; ctx.lineTo(X(x0 + (x1 - x0) * f), Y(y0 + (y1 - y0) * f)); break; } }
        ctx.stroke();
      });
    }
    function path(i) { let c = i; const pts = [[c, 0]]; for (let l = 0; l < L; l++) { const y = l + 1; if (rungs[l][c]) { pts.push([c, y], [c + 1, y]); c++; } else if (c > 0 && rungs[l][c - 1]) { pts.push([c, y], [c - 1, y]); c--; } } pts.push([c, L + 1]); return { pts, end: c }; }
    function trace(i, fast) {
      return new Promise(res => {
        if (traced.has(i)) { res(); return; }
        const p = path(i), cum = []; let acc = 0;
        for (let k = 1; k < p.pts.length; k++) { acc += Math.abs(p.pts[k][0] - p.pts[k - 1][0]) + Math.abs(p.pts[k][1] - p.pts[k - 1][1]); cum.push(acc); }
        const t = { pts: p.pts, end: p.end, prog: 0, done: false }; traced.set(i, t); top.children[i].classList.add('on');
        const speed = (reduced ? 200 : fast ? 24 : 11) / 1000; let last = performance.now(), vtx = 0;
        const f = now => {
          t.prog = Math.min(acc, t.prog + (now - last) * speed); last = now;
          while (vtx < cum.length && t.prog >= cum[vtx]) { vtx++; Sfx.blip(vtx); }
          draw();
          if (t.prog < acc) raf = requestAnimationFrame(f);
          else { t.done = true; paintBottom(); Sfx.ding(); u.show(`${N[i]} → ${R[p.end]}`, '', 'silent'); u.log(`${N[i]} → ${R[p.end]}`); res(); }
        };
        raf = requestAnimationFrame(f);
      });
    }
    const ro = new ResizeObserver(size); ro.observe(box); u.cleanups.push(() => { ro.disconnect(); cancelAnimationFrame(raf); });
    names.onchange = resL.onchange = () => { if (!u.busy) gen(); };
    gen();
    u.go('全部揭曉', async () => {
      if (n < 2) { u.msg('至少要兩位參加者'); return; }
      for (let i = 0; i < n; i++) { if (!traced.has(i)) { await trace(i, true); await sleep(160); } }
      u.show('全部揭曉', '', 'win');
    });
  } },
{ id: 'slot', name: '拉霸機', en: 'Slot Machine', cat: 'slot', color: '#C25A6E', desc: '三個一樣就中獎',
  mount(u) {
    const SYM = [{ k: '7', c: '#DF6448' }, { k: 'BAR', c: '#2A2F36' }, { k: '★', c: '#E0A030' }, { k: '◆', c: '#4A87B8' }, { k: '♥', c: '#DA7890' }, { k: '♣', c: '#3F9476' }];
    const boost = toggle(u.settings, { id: 'slotBoost', label: '派對模式（提高中獎機率）', def: false });
    const stats = h('<p class="note"></p>'); u.settings.append(stats);
    let spins = store.get('slot:spins', 0), wins = store.get('slot:wins', 0);
    const paintStats = () => { stats.textContent = `已拉 ${spins} 次，大獎 ${wins} 次`; };
    paintStats();
    sbtn(u.settings, '次數歸零', () => { spins = wins = 0; store.set('slot:spins', 0); store.set('slot:wins', 0); paintStats(); });
    const m = h('<div class="slotm"><div class="cab"><div class="cab-top">★ LUCKY 7 ★</div><div class="reels"></div></div><button class="lever" type="button" aria-label="拉下拉桿"><span class="stick"></span><span class="knobball"></span></button></div>');
    u.stage.append(m);
    const idx = SYM.map((_, i) => i);
    const R = makeReels(m.querySelector('.reels'), 3, { render: i => `<span class="sym${SYM[i].k === 'BAR' ? ' bar' : ''}" style="color:${SYM[i].c}">${SYM[i].k}</span>` });
    R.init([idx, idx, idx]);
    const lever = m.querySelector('.lever');
    const run = u.go('拉霸！', async () => {
      lever.classList.add('pull'); setTimeout(() => lever.classList.remove('pull'), 380); Sfx.ratchet(3, .2);
      let fin; if (boost.get() && rndf() < .3) { const s = rnd(6); fin = [s, s, s]; } else fin = [rnd(6), rnd(6), rnd(6)];
      await sleep(200);
      await R.spin([idx, idx, idx], fin, reduced ? 300 : 1500);
      spins++; const [a, b, c] = fin, txt = fin.map(i => SYM[i].k).join(' ');
      if (a === b && b === c) { wins++; u.show(a === 0 ? '777 大獎！' : 'JACKPOT！', txt, 'big'); const cab = m.querySelector('.cab'); cab.classList.add('flash'); setTimeout(() => cab.classList.remove('flash'), 1600); }
      else if (a === b || b === c || a === c) u.show('小獎', txt + ' · 兩個一樣', 'win');
      else u.show('再接再厲', txt, 'lose');
      store.set('slot:spins', spins); store.set('slot:wins', wins); paintStats(); u.log(txt);
    });
    lever.onclick = run;
  } },
{ id: 'textslot', name: '文字拉霸', en: 'Text Slot', cat: 'slot', color: '#4E9F80', desc: '每一欄各抽一個，組成一句話',
  mount(u) {
    const cols = [listField(u.settings, { id: 'ts1', label: '第 1 欄', def: DEF.ts1, rows: 4 }), listField(u.settings, { id: 'ts2', label: '第 2 欄', def: DEF.ts2, rows: 4 }), listField(u.settings, { id: 'ts3', label: '第 3 欄（不用可以清空）', def: DEF.ts3, rows: 4 })];
    const m = h('<div class="tslot"><div class="cab" style="--tc:#4E9F80"><div class="cab-top">WORD SLOT</div><div class="reels text"></div></div></div>'); u.stage.append(m);
    const rc = m.querySelector('.reels'); let R = null, active = [];
    function build() { active = cols.map(c => c.get()).filter(a => a.length); rc.innerHTML = ''; if (!active.length) { R = null; rc.innerHTML = '<p class="note" style="color:#fff;padding:20px">三欄都是空的，先在右邊寫幾項</p>'; return; } R = makeReels(rc, active.length, { render: x => `<span class="tcell">${esc(x)}</span>` }); R.init(active); }
    build(); cols.forEach(c => c.onchange = () => { if (!u.busy) build(); });
    u.go('拉一下', async () => {
      build(); if (!R) { u.msg('先在右邊寫幾項'); return; }
      const fin = active.map(a => a[rnd(a.length)]);
      Sfx.ratchet(3, .2); await R.spin(active, fin, reduced ? 300 : 1300);
      const txt = fin.join(' '); u.show(txt, '', 'win'); u.log(txt);

];

/* ---------- app shell ---------- */
const view = $('#view');
let current = null;

function renderHome() {
  document.title = '抽籤遊樂場';
  const cat = store.get('homeCat', 'all');
  view.innerHTML = `
    <h1 class="sr">抽籤遊樂場</h1>
    <div class="chips" role="toolbar" aria-label="分類">${[['all', '全部'], ...Object.entries(CATS)].map(([k, l]) => `<button type="button" data-c="${k}" aria-pressed="${k === cat}">${l}</button>`).join('')}</div>
    <div class="grid">${TOOLS.map(t => `<button type="button" class="card" data-id="${t.id}" data-cat="${t.cat}" style="--tc:${t.color}"${cat !== 'all' && cat !== t.cat ? ' hidden' : ''}>
      <span class="art">${ICON[t.id](t.color)}</span>${t.isNew ? '<span class="new">新</span>' : ''}<span class="tag">${CATS[t.cat]}</span>
      <span class="nm">${t.name}</span><span class="desc">${t.desc}</span></button>`).join('')}</div>`;
  view.querySelectorAll('.chips button').forEach(b => b.onclick = () => {
    Sfx.click(); store.set('homeCat', b.dataset.c);
    view.querySelectorAll('.chips button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    view.querySelectorAll('.card').forEach(c => { c.hidden = b.dataset.c !== 'all' && c.dataset.cat !== b.dataset.c; });
  });
  view.querySelectorAll('.card').forEach(c => c.onclick = () => { Sfx.unlock(); Sfx.pop(); location.hash = c.dataset.id; });
}

function openTool(t) {
  document.title = t.name + '｜抽籤遊樂場';
  view.innerHTML = `
  <section class="tool" style="--tc:${t.color};--tci:${t.ink || '#fff'}">
    <div class="toolhead"><button class="back" type="button">← 全部玩法</button><div class="tt"><h1>${t.name}</h1><span class="en">${t.en}</span></div></div>
    <div class="toolbody">
      <div class="stagecard">
        <div class="stage"></div>
        <div class="result" aria-live="polite"></div>
        <div class="actions"></div>
      </div>
      <aside class="panel">
        <div class="pbox settings"><h2>設定</h2></div>
        <div class="pbox"><h2>紀錄<button type="button" class="linkbtn clr">清除</button></h2><ol class="hist"></ol></div>
      </aside>
    </div>
  </section>`;
  view.querySelector('.back').onclick = () => { Sfx.click(); location.hash = ''; };
  const resultEl = view.querySelector('.result'), histEl = view.querySelector('.hist');
  const hkey = 'hist:' + t.id; let hist = store.get(hkey, []);
  const paintHist = () => { histEl.innerHTML = hist.length ? hist.map(x => `<li><time>${esc(x.t)}</time><span>${esc(x.v)}</span></li>`).join('') : '<li class="empty">還沒有紀錄</li>'; };
  paintHist();
  view.querySelector('.clr').onclick = () => { hist = []; store.set(hkey, hist); paintHist(); };
  const u = {
    stage: view.querySelector('.stage'), settings: view.querySelector('.settings'), actions: view.querySelector('.actions'),
    cleanups: [], busy: false, trigger: null, after: null,
    show(main, sub = '', level = 'plain', huge = false) {
      resultEl.innerHTML = `<div class="r-main${huge ? ' huge' : ''}">${esc(main)}</div>${sub ? `<div class="r-sub">${esc(sub)}</div>` : ''}`;
      resultEl.dataset.level = level; resultEl.classList.remove('pop'); void resultEl.offsetWidth; resultEl.classList.add('pop');
      if (level === 'big') { Sfx.bigWin(); Confetti.burst(180); }
      else if (level === 'win') { Sfx.win(); Confetti.burst(70); }
      else if (level === 'lose') Sfx.lose();
      else if (level === 'plain') Sfx.reveal();
    },
    msg(text) { resultEl.innerHTML = `<div class="r-note">${esc(text)}</div>`; resultEl.dataset.level = 'note'; resultEl.classList.remove('pop'); },
    log(v) { const d = new Date(); hist.unshift({ t: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`, v }); hist = hist.slice(0, 30); store.set(hkey, hist); paintHist(); },
    async run(fn) {
      if (u.busy) return; Sfx.unlock(); u.busy = true; u.actions.querySelectorAll('button').forEach(b => b.disabled = true);
      try { await fn(); } catch (e) { console.error(e); u.msg('出了點問題，再按一次試試'); }
      finally { u.busy = false; u.actions.querySelectorAll('button').forEach(b => b.disabled = false); if (u.after) u.after(); }
    },
    go(label, fn) { const b = h(`<button class="go" type="button">${label}</button>`); u.actions.append(b); const r = () => u.run(fn); b.onclick = r; u.trigger = r; return r; }
  };
  t.mount(u);
  current = u;
}

function route() {
  if (current) { current.cleanups.forEach(f => { try { f(); } catch (e) {} }); current = null; }
  const id = location.hash.slice(1), t = TOOLS.find(x => x.id === id);
  t ? openTool(t) : renderHome();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
$('#brand').onclick = () => { Sfx.click(); location.hash = ''; };

/* sound controls */
const muteBtn = $('#mute'), volIn = $('#vol');
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const paintMute = () => { muteBtn.innerHTML = Sfx.muted ? ICON_OFF : ICON_ON; muteBtn.setAttribute('aria-label', Sfx.muted ? '開啟聲音' : '靜音'); muteBtn.setAttribute('aria-pressed', String(Sfx.muted)); };
volIn.value = Sfx.vol; paintMute();
muteBtn.onclick = () => { Sfx.unlock(); Sfx.setMuted(!Sfx.muted); paintMute(); if (!Sfx.muted) Sfx.ding(); };
volIn.addEventListener('input', () => { Sfx.unlock(); Sfx.setVol(+volIn.value); if (Sfx.muted) { Sfx.setMuted(false); paintMute(); } });
volIn.addEventListener('change', () => Sfx.tick(1));

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || !current || !current.trigger) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (['INPUT', 'TEXTAREA', 'BUTTON', 'SELECT'].includes(tag)) return;
  e.preventDefault(); current.trigger();
});
document.addEventListener('pointerdown', () => Sfx.unlock(), { once: true });

route();
})();
</script>
